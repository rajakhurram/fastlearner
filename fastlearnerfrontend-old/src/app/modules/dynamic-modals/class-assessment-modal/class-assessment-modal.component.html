<!-- Creation UI -->
<div *ngIf="!success">
  <div class="modal-container">
    <div class="modal-header">
      <h3>New {{ type === "class" ? "Class" : "Assessment" }}</h3>
    </div>

    <label>{{ type === "class" ? "Class" : "Assessment" }} name</label>
    <input
      type="text"
      class="modal-input"
      [(ngModel)]="name"
      [placeholder]="'Enter ' + type + ' name'"
      [disabled]="loading"
      (keydown.enter)="onSend()"
    />

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button class="send-btn" [disabled]="loading || !name.trim()" (click)="onSend()">Create</button>
    </div>
  </div>
</div>

<!-- Success screen -->
<div *ngIf="success" style="padding: 24px; text-align: center;">
  <nz-result
    nzStatus="success"
    nzTitle="{{ type === 'class' ? 'Class created successfully' : 'Assessment created successfully' }}"
    [nzExtra]="successButton"
  ></nz-result>
</div>

<ng-template #successButton>
  <button  nz-button nzType="primary" (click)="onCancel()" class="done">Done</button>
</ng-template>
