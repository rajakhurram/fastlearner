<div class="container">
  <p class="message">{{ msg }}</p>

  <div nz-row class="mt-3 custom-buttons" [nzGutter]="16" justify="center">
    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" class="text-center">
      <app-button
        class="backBtn"
        [config]="buttonCancelConfig"
        [buttonText]="'Cancel'"
        (buttonCallBack)="onCancel()"
      ></app-button>
    </div>

    <div nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" class="text-center">
      <app-button
        class="continueBtn"
        [config]="buttonAddConfig"
        [buttonText]="secondBtnText"
        (buttonCallBack)="onDelete()"
      ></app-button>
    </div>
  </div>
</div>
