<div>
      <div nz-row nzJustify="space-between" nzAlign="middle" class="modal-header">
        <h4>AI Report Preview - {{ quizTitle }}</h4>
      </div>
      <div nz-row>
        <div nz-col nzSpan="24">
          <!-- <div class="report-content" [innerHTML]="sanitizedReportContent">
          </div> -->
          <iframe
            style="width: 100%; height: 55vh"
            [srcdoc]="sanitizedReportContent"
            frameborder="0"
            sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
      <div nz-row nzJustify="end" class="modal-footer">
        <button nz-button nzType="default" (click)="close()">Close</button>
        <button nz-button nzType="primary" (click)="downloadReport()">Download as HTML</button>
        <!-- <button nz-button nzType="default" (click)="downloadAsPdf()">Download as PDF</button> -->
      </div>
    </div>
